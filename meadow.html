<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meadow — a gentle breeze</title>
  <link rel="stylesheet" href="meadow.css">
</head>
<body>
  <main>
    <section class="meadow" role="img" aria-label="A sunlit green meadow beneath a blue sky, with daisies and yellow flowers moving gently in a light breeze.">
      <div class="meadow-scene" aria-hidden="true">
        <img class="meadow-background" src="images/meadow/background.jpg" width="6264" height="2688" alt="" fetchpriority="high" draggable="false">
        <img class="cloud cloud-top" src="images/meadow/cloud-top.png" width="255" height="49" alt="" draggable="false">
        <img class="cloud cloud-1" src="images/meadow/cloud-1.png" width="205" height="79" alt="" draggable="false">
        <img class="cloud cloud-3" src="images/meadow/cloud-3.png" width="173" height="84" alt="" draggable="false">
        <img class="flower depth-left" src="images/meadow/depth-left.png" width="410" height="281" alt="" draggable="false">
        <img class="flower depth-middle" src="images/meadow/depth-middle.png" width="589" height="218" alt="" draggable="false">
        <img class="flower depth-right" src="images/meadow/depth-right.png" width="421" height="212" alt="" draggable="false">
        <img class="flower foreground-left" src="images/meadow/left.png" width="438" height="260" alt="" draggable="false">
        <img class="flower foreground-middle" src="images/meadow/middle.png" width="990" height="245" alt="" draggable="false">
        <img class="flower foreground-right" src="images/meadow/right.png" width="562" height="257" alt="" draggable="false">
      </div>
    </section>
  </main>
</body>
</html>
